apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ns-simplebankapp
  name: simplebankapp-deployment
  labels:
    app: simplebankapp
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simplebankapp
  template:
    metadata:
      labels:
        app: simplebankapp
        environment: production
    spec:
      containers:
        - name: simplebankapp-container
          image: mokadir/mkadir-bankapp:3
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: APP_ENV
              value: "production"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/mkadir_bankdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simplebankapp-secrets
                  key: db-password
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
