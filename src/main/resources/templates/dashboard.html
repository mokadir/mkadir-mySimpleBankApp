<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - Mkadir Bank</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --text-color: #e0e0e0;
            --heading-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-glow: rgba(0, 0, 0, 0.2);
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-text: #ffffff;
            --label-color: rgba(255, 255, 255, 0.6);
            --navbar-bg: rgba(15, 12, 41, 0.85);
            --navbar-border: rgba(255, 255, 255, 0.05);
            --nav-link-color: rgba(255, 255, 255, 0.7);
            --nav-link-hover-bg: rgba(102, 126, 234, 0.15);
            --footer-bg: rgba(15, 12, 41, 0.6);
            --footer-border: rgba(255, 255, 255, 0.05);
            --footer-text: rgba(255, 255, 255, 0.5);
            --link-color: #667eea;
            --link-hover: #764ba2;
            --btn-primary-gradient: linear-gradient(135deg, #667eea, #764ba2);
            --btn-primary-shadow: rgba(102, 126, 234, 0.3);
            --btn-success-gradient: linear-gradient(135deg, #43e97b, #38f9d7);
            --btn-success-shadow: rgba(67, 233, 123, 0.25);
            --btn-success-text: #0f0c29;
            --gradient-text: linear-gradient(135deg, #667eea, #764ba2);
            --orb-1-bg: radial-gradient(circle, #667eea, #764ba2);
            --orb-2-bg: radial-gradient(circle, #f093fb, #f5576c);
            --orb-opacity: 0.25;
            --toggle-icon-color: rgba(255, 255, 255, 0.6);
            --error-bg: rgba(245, 87, 108, 0.1);
            --error-border: rgba(245, 87, 108, 0.2);
            --error-text: #f5576c;
            --balance-gradient: linear-gradient(135deg, #43e97b, #38f9d7);
            --account-number-text: rgba(255, 255, 255, 0.9);
            --account-label-text: rgba(255, 255, 255, 0.7);
            --account-heading: rgba(255, 255, 255, 0.8);
        }
        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #e8eaf6 0%, #c5cae9 50%, #bbdefb 100%);
            --text-color: #37474f;
            --heading-color: #1a237e;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.3);
            --card-glow: rgba(0, 0, 0, 0.08);
            --input-bg: rgba(255, 255, 255, 0.8);
            --input-border: rgba(0, 0, 0, 0.12);
            --input-text: #263238;
            --label-color: rgba(0, 0, 0, 0.5);
            --navbar-bg: rgba(255, 255, 255, 0.85);
            --navbar-border: rgba(0, 0, 0, 0.06);
            --nav-link-color: rgba(0, 0, 0, 0.6);
            --nav-link-hover-bg: rgba(57, 73, 171, 0.08);
            --footer-bg: rgba(255, 255, 255, 0.7);
            --footer-border: rgba(0, 0, 0, 0.06);
            --footer-text: rgba(0, 0, 0, 0.45);
            --link-color: #3949ab;
            --link-hover: #5c6bc0;
            --btn-primary-gradient: linear-gradient(135deg, #3949ab, #5c6bc0);
            --btn-primary-shadow: rgba(57, 73, 171, 0.3);
            --btn-success-gradient: linear-gradient(135deg, #43e97b, #38f9d7);
            --btn-success-shadow: rgba(67, 233, 123, 0.25);
            --btn-success-text: #ffffff;
            --gradient-text: linear-gradient(135deg, #3949ab, #5c6bc0);
            --orb-1-bg: radial-gradient(circle, #7986cb, #9fa8da);
            --orb-2-bg: radial-gradient(circle, #f48fb1, #ce93d8);
            --orb-opacity: 0.4;
            --toggle-icon-color: #f9a825;
            --error-bg: rgba(229, 57, 53, 0.08);
            --error-border: rgba(229, 57, 53, 0.2);
            --error-text: #d32f2f;
            --balance-gradient: linear-gradient(135deg, #43a047, #66bb6a);
            --account-number-text: #1a237e;
            --account-label-text: #37474f;
            --account-heading: #1a237e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: var(--orb-opacity);
            z-index: 0;
            animation: float 8s ease-in-out infinite;
            transition: opacity 0.4s ease;
        }
        body::before {
            width: 500px; height: 500px;
            background: var(--orb-1-bg);
            top: -150px; left: -150px;
        }
        body::after {
            width: 400px; height: 400px;
            background: var(--orb-2-bg);
            bottom: -100px; right: -100px;
            animation-delay: -4s;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }
        .theme-toggle {
            background: none; border: none;
            color: var(--toggle-icon-color);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(20deg);
        }
        [data-theme="light"] .theme-toggle:hover { background: rgba(0, 0, 0, 0.06); }
        .navbar-custom {
            background: var(--navbar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--navbar-border);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 12px 20px;
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .navbar-custom a { color: var(--text-color) !important; text-decoration: none; }
        .navbar-custom .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .navbar-nav .nav-link {
            color: var(--nav-link-color) !important;
            transition: all 0.3s ease;
            padding: 8px 16px !important;
            border-radius: 8px;
            margin: 0 2px;
        }
        .navbar-nav .nav-link:hover {
            color: var(--text-color) !important;
            background: var(--nav-link-hover-bg);
        }
        .dashboard-container {
            max-width: 1000px;
            width: 95%;
            margin-top: 80px;
            padding-bottom: 80px;
            position: relative;
            z-index: 1;
        }
        h2, h3 { margin-bottom: 20px; font-weight: 600; }
        h2 { font-size: 2rem; letter-spacing: -0.5px; color: var(--heading-color); transition: color 0.4s ease; }
        h3 { font-size: 1.6rem; color: var(--text-color); }
        .btn-primary {
            background: var(--btn-primary-gradient);
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #ffffff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px var(--btn-primary-shadow);
            color: #ffffff;
        }
        .btn-success {
            background: var(--btn-success-gradient);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            color: var(--btn-success-text);
            transition: all 0.3s ease;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--btn-success-shadow);
            color: var(--btn-success-text);
        }
        .form-container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            margin-top: 12px;
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .form-container .form-group label {
            color: var(--label-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
            transition: color 0.4s ease;
        }
        .form-container .form-group input {
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--input-text);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-container .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        .account-details {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            margin-bottom: 30px;
            box-shadow: 0 15px 35px var(--card-glow);
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }
        .account-details h4 { color: var(--account-heading); margin-bottom: 15px; font-weight: 600; transition: color 0.4s ease; }
        .account-details p { margin-bottom: 8px; color: var(--account-label-text); transition: color 0.4s ease; }
        .account-details strong { color: var(--account-number-text); transition: color 0.4s ease; }
        .error {
            color: var(--error-text);
            font-weight: 500;
            padding: 12px 16px;
            background: var(--error-bg);
            border-radius: 12px;
            border: 1px solid var(--error-border);
        }
        .footer {
            background: var(--footer-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--footer-text);
            padding: 15px 0;
            font-size: 13px;
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            border-top: 1px solid var(--footer-border);
            z-index: 1;
            transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }
        .footer a { color: var(--link-color); text-decoration: none; font-weight: 500; }
        .footer a:hover { color: var(--link-hover); }
        .balance-amount {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--balance-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (max-width: 576px) {
            body { overflow: auto; height: auto; padding: 20px 0; }
            body::before, body::after { filter: blur(60px); opacity: calc(var(--orb-opacity) * 0.6); }
            body::before { width: 300px; height: 300px; top: -80px; left: -80px; }
            body::after { width: 250px; height: 250px; bottom: -60px; right: -60px; }
            .navbar-custom { padding: 10px 15px; }
            .navbar-custom .navbar-brand { font-size: 1.1rem; }
            .dashboard-container { margin-top: 70px; padding-bottom: 70px; }
            h2 { font-size: 1.4rem; }
            h3 { font-size: 1.2rem; }
            .row.justify-content-center { flex-direction: column; align-items: center; }
            .row.justify-content-center > .col-md-3 { max-width: 280px; width: 100%; margin-bottom: 15px; flex: 0 0 auto; }
            .btn-primary { padding: 10px 16px; font-size: 0.9rem; }
            .account-details { padding: 18px; }
            .account-details p { font-size: 0.9rem; }
            .footer { font-size: 11px; padding: 10px 0; }
            @keyframes float {
                0%, 100% { transform: translateY(0) scale(1); }
                50% { transform: translateY(-15px) scale(1.03); }
            }
            .theme-toggle {
                margin-right: 0;
            }
        }

        @media (min-width: 577px) and (max-width: 768px) {
            .dashboard-container { width: 98%; }
            h2 { font-size: 1.6rem; }
            h3 { font-size: 1.3rem; }
            .row.justify-content-center > .col-md-3 { max-width: 220px; }
            .account-details { padding: 20px; }
        }

        @media (min-width: 769px) and (max-width: 992px) {
            .row.justify-content-center > .col-md-3 { max-width: 250px; }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand" href="#">Mkadir Bank</a>
    <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/transactions">Transactions</a></li>
        <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
        <li class="nav-item"><button class="theme-toggle nav-link" id="themeToggle" title="Toggle theme"><i class="fas fa-moon"></i></button></li>
    </ul>
</nav>

<div class="container dashboard-container">
    <div class="text-center">
        <h2 th:text="'Welcome, ' + ${account.username}"></h2>
        <h3 th:text="'Current Balance: $' + ${account.balance}"></h3>
    </div>

    <div class="account-details">
        <h4>Account Details</h4>
        <p><strong>Account Number:</strong> <span th:text="${account.id}"></span></p>
        <p><strong>Account Type:</strong> Savings</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-3">
            <button class="btn btn-block btn-primary" type="button" data-toggle="collapse" data-target="#depositForm" aria-expanded="false" aria-controls="depositForm">
                Deposit
            </button>
            <div class="collapse mt-3" id="depositForm">
                <form method="post" action="/deposit" class="form-container">
                    <div class="form-group">
                        <label>Amount:</label>
                        <input type="number" class="form-control" name="amount" required />
                    </div>
                    <button type="submit" class="btn btn-block btn-success">Submit</button>
                </form>
            </div>
        </div>

        <div class="col-md-3">
            <button class="btn btn-block btn-primary" type="button" data-toggle="collapse" data-target="#withdrawForm" aria-expanded="false" aria-controls="withdrawForm">
                Withdraw
            </button>
            <div class="collapse mt-3" id="withdrawForm">
                <form method="post" action="/withdraw" class="form-container">
                    <div class="form-group">
                        <label>Amount:</label>
                        <input type="number" class="form-control" name="amount" required />
                    </div>
                    <button type="submit" class="btn btn-block btn-success">Submit</button>
                </form>
            </div>
        </div>

        <div class="col-md-3">
            <button class="btn btn-block btn-primary" type="button" data-toggle="collapse" data-target="#transferForm" aria-expanded="false" aria-controls="transferForm">
                Transfer Money
            </button>
            <div class="collapse mt-3" id="transferForm">
                <form method="post" action="/transfer" class="form-container">
                    <div class="form-group">
                        <label>Recipient Username:</label>
                        <input type="text" class="form-control" name="toUsername" required />
                    </div>
                    <div class="form-group">
                        <label>Amount:</label>
                        <input type="number" class="form-control" name="amount" required />
                    </div>
                    <button type="submit" class="btn btn-block btn-success">Submit</button>
                </form>
            </div>
        </div>
    </div>

    <p th:if="${error != null}" th:text="${error}" class="error text-center mt-3"></p>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    (function() {
        const html = document.documentElement;
        const toggle = document.getElementById('themeToggle');
        const icon = toggle.querySelector('i');
        function setTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('mkadir-theme', theme);
            icon.className = theme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
        }
        const saved = localStorage.getItem('mkadir-theme');
        setTheme(saved || 'dark');
        toggle.addEventListener('click', function() {
            setTheme(html.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        });
    })();
</script>
</body>
</html>
